limit_req_zone $binary_remote_addr zone=chat:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=admin:10m rate=60r/m;

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 256k;

    # реальный IP клиента берём из заголовка Caddy (он единственный, кто ходит сюда из docker-сети)
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ответ модели может идти до минуты
    proxy_read_timeout 120s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location = /api/chat {
        limit_req zone=chat burst=10 nodelay;
        proxy_pass http://app:8000;
    }

    location /api/admin/ {
        limit_req zone=admin burst=30 nodelay;
        proxy_pass http://app:8000;
    }

    location / {
        proxy_pass http://app:8000;
    }
}
