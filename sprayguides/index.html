<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Спрейгайды — SprayStore</title>
<style>
  :root {
    --bg: #f7f7f4;
    --card: #ececea;
    --line: #e8e8e3;
    --text: #171717;
    --muted: #5f5f5a;
    --yellow: #ead000;
    --yellow-hover: #f6dc00;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
  }

  .sg {
    width: min(1600px, calc(100% - 48px));
    margin: 0 auto;
    padding: 40px 0 56px;
  }

  .sg__head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px 32px;
    margin-bottom: 24px;
  }

  .sg__title {
    margin: 0;
    font-size: clamp(32px, 3.6vw, 56px);
    line-height: 0.98;
    font-weight: 900;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }

  .sg__text {
    max-width: 560px;
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.5;
  }

  .sg__search {
    width: min(360px, 100%);
    height: 52px;
    padding: 0 18px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    outline: none;
  }

  .sg__search:focus { border-color: var(--text); }

  /* ФИЛЬТРЫ */

  .sg__filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }

  .sg__chip {
    height: 40px;
    padding: 0 16px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background-color .2s ease, border-color .2s ease;
  }

  .sg__chip:hover { border-color: #d0d0c8; }

  .sg__chip.is-active {
    background: var(--yellow);
    border-color: var(--yellow);
  }

  .sg__chip--model { font-weight: 600; }

  .sg__count {
    margin: 18px 0 16px;
    color: var(--muted);
    font-size: 14px;
  }

  /* СЕТКА */

  .sg__grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
  }

  .sg__card {
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
    text-decoration: none;
    overflow: hidden;
    transition: border-color .2s ease;
  }

  .sg__card:hover { border-color: #d0d0c8; }

  .sg__photo {
    aspect-ratio: 3 / 4;
    padding: 20px 20px 0;
    overflow: hidden;
  }

  .sg__photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center top;
    background: #fff;
    box-shadow: 0 6px 20px rgba(0,0,0,.08);
    transition: transform .5s ease;
  }

  .sg__card:hover .sg__photo img { transform: scale(1.03); }

  .sg__body {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px 20px 20px;
  }

  .sg__model {
    align-self: flex-start;
    padding: 4px 8px;
    background: var(--text);
    color: var(--yellow);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .sg__name {
    font-size: clamp(16px, 1.3vw, 20px);
    line-height: 1.1;
    font-weight: 900;
    text-transform: uppercase;
  }

  .sg__meta {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
  }

  .sg__open {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    background: var(--yellow);
    color: #111;
    font-size: 16px;
    transition: transform .2s ease, background-color .2s ease;
  }

  .sg__card:hover .sg__open {
    background: var(--yellow-hover);
    transform: translate(2px, -2px);
  }

  .sg__empty {
    padding: 48px 24px;
    border: 1px dashed #d0d0c8;
    color: var(--muted);
    text-align: center;
  }

  @media (max-width: 1100px) {
    .sg { width: calc(100% - 40px); }
    .sg__grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  }

  @media (max-width: 767px) {
    .sg { width: calc(100% - 32px); padding: 28px 0 40px; }
    .sg__title { font-size: 30px; }
    .sg__text { font-size: 14px; }
    .sg__search { width: 100%; height: 48px; }
    .sg__filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .sg__filters::-webkit-scrollbar { display: none; }
    .sg__chip { flex: 0 0 auto; height: 36px; font-size: 13px; }
    .sg__grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .sg__photo { padding: 12px 12px 0; }
    .sg__body { padding: 10px 12px 12px; gap: 8px; }
    .sg__name { font-size: 14px; }
    .sg__meta { font-size: 11px; }
    .sg__open { width: 28px; height: 28px; font-size: 13px; }
  }
</style>
</head>
<body>
<main class="sg">

  <div class="sg__head">
    <div>
      <h1 class="sg__title">Спрейгайды</h1>
      <p class="sg__text">Рекомендации по работе краскопультов с конкретными красками. Откройте нужный PDF или скачайте его.</p>
    </div>
    <input class="sg__search" id="q" type="search" placeholder="Поиск: краска или модель" autocomplete="off">
  </div>

  <div class="sg__filters" id="groups"></div>
  <div class="sg__filters" id="models"></div>

  <p class="sg__count" id="count"></p>
  <div class="sg__grid" id="grid"></div>

</main>

<script>
(function () {
  var state = { group: "", model: "", q: "" };
  var all = [];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function mb(bytes) {
    return (bytes / 1048576).toFixed(1).replace(".", ",") + " МБ";
  }

  function chips(box, values, key, allLabel, extraCls) {
    box.innerHTML = "";
    [""].concat(values).forEach(function (v) {
      var b = el("button", "sg__chip" + (extraCls ? " " + extraCls : ""), v || allLabel);
      b.type = "button";
      if (state[key] === v) b.classList.add("is-active");
      b.onclick = function () { state[key] = v; if (key === "group") state.model = ""; render(); };
      box.appendChild(b);
    });
  }

  function render() {
    var groups = [];
    all.forEach(function (it) { if (groups.indexOf(it.group) < 0) groups.push(it.group); });
    var box = document.getElementById("groups");
    if (groups.length > 1) chips(box, groups, "group", "Все бренды"); else box.innerHTML = "";

    var inGroup = all.filter(function (it) { return !state.group || it.group === state.group; });
    var models = [];
    inGroup.forEach(function (it) { if (it.model && models.indexOf(it.model) < 0) models.push(it.model); });
    models.sort();
    chips(document.getElementById("models"), models, "model", "Все модели", "sg__chip--model");

    var q = state.q.toLowerCase();
    var list = inGroup.filter(function (it) {
      if (state.model && it.model !== state.model) return false;
      if (!q) return true;
      return (it.title + " " + it.model + " " + it.name + " " + it.group).toLowerCase().indexOf(q) >= 0;
    });

    document.getElementById("count").textContent = "Найдено: " + list.length;
    var grid = document.getElementById("grid");
    grid.innerHTML = "";

    if (!list.length) {
      var empty = el("div", "sg__empty", "Ничего не нашлось. Попробуйте другую модель или краску.");
      empty.style.gridColumn = "1 / -1";
      grid.appendChild(empty);
      return;
    }

    list.forEach(function (it) {
      var a = el("a", "sg__card");
      a.href = it.file;
      a.target = "_blank";
      a.rel = "noopener";

      var photo = el("div", "sg__photo");
      if (it.cover) {
        var img = el("img");
        img.src = it.cover;
        img.alt = it.title;
        img.loading = "lazy";
        photo.appendChild(img);
      }
      a.appendChild(photo);

      var body = el("div", "sg__body");
      if (it.model) body.appendChild(el("span", "sg__model", it.model));
      body.appendChild(el("span", "sg__name", it.title));
      var meta = el("span", "sg__meta");
      meta.appendChild(el("span", "", "PDF · " + mb(it.size)));
      meta.appendChild(el("span", "sg__open", "↗"));
      body.appendChild(meta);
      a.appendChild(body);

      grid.appendChild(a);
    });
  }

  document.getElementById("q").addEventListener("input", function (e) {
    state.q = e.target.value.trim();
    render();
  });

  fetch("data.json?v=" + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      (data.groups || []).forEach(function (g) {
        g.items.forEach(function (it) { it.group = g.name; all.push(it); });
      });
      render();
    })
    .catch(function () {
      document.getElementById("grid").appendChild(el("div", "sg__empty", "Не удалось загрузить список. Обновите страницу."));
    });
})();
</script>
</body>
</html>
