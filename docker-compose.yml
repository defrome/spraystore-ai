services:
  app:
    build: .
    restart: unless-stopped
    env_file: service/.env
    environment:
      # на стейджинге чат встраивается с этого же адреса; для другого домена-хоста добавьте его через запятую
      CORS_ORIGINS: ${CORS_ORIGINS:-https://158-160-204-91.sslip.io,https://158.160.204.91}
    volumes:
      - data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 120s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    expose:
      - "80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [nginx]
    ports:
      - "80:80"     # нужен для выпуска сертификата и редиректа на https
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-158-160-204-91.sslip.io}
      LOCAL_CERTS: ${TLS_MODE:+local_certs}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  data:
  caddy_data:
