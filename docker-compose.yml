services:
  app:
    build: .
    restart: unless-stopped
    env_file: service/.env
    environment:
      # на стейджинге чат встраивается с этого же адреса; для другого домена-хоста добавьте его через запятую
      CORS_ORIGINS: ${CORS_ORIGINS:-http://158.160.204.91}
    volumes:
      - data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 120s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  data:
