<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пример встраивания чата</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #fff; min-height: 100vh; }
  .note { padding: 40px; color: #aaa; }

  /* Окно чата на сайте */
  #ssFrameWrap {
    position: fixed; right: 24px; bottom: 24px; width: 420px; height: min(720px, calc(100vh - 48px));
    border-radius: 24px; overflow: hidden; box-shadow: 0 30px 80px -20px rgba(0,0,0,.6);
    transform-origin: bottom right; transition: opacity .3s, transform .45s cubic-bezier(.34,1.56,.64,1);
  }
  #ssFrameWrap.closed { opacity: 0; transform: translateY(20px) scale(.9); pointer-events: none; }
  #ssFrameWrap iframe { width: 100%; height: 100%; border: 0; display: block; }
  #ssOpen { position: fixed; right: 24px; bottom: 24px; padding: 14px 20px; border: 0; border-radius: 999px;
    background: #FFD60A; font-weight: 700; cursor: pointer; }
  @media (max-width: 520px) { #ssFrameWrap { inset: 0; width: 100%; height: 100%; border-radius: 0; } }
</style>
</head>
<body>
  <p class="note">Страница сайта. Чат ниже — это index.html внутри iframe.</p>

  <button id="ssOpen" hidden>Чат поддержки</button>
  <div id="ssFrameWrap">
    <iframe id="ssFrame" src="index.html" title="Чат поддержки SprayStore" allow="clipboard-write"></iframe>
  </div>

<script>
  const wrap = document.getElementById('ssFrameWrap');
  const openBtn = document.getElementById('ssOpen');
  const frame = document.getElementById('ssFrame');

  // События из чата
  window.addEventListener('message', e => {
    const d = e.data;
    if (!d || d.source !== 'spraystore-chat') return;
    console.log('[chat]', d.type, d);
    if (d.type === 'close') { wrap.classList.add('closed'); openBtn.hidden = false; }
  });

  openBtn.onclick = () => {
    wrap.classList.remove('closed'); openBtn.hidden = true;
    frame.contentWindow.postMessage({ source: 'spraystore-host', type: 'focus' }, '*');
  };

  // Пример: задать вопрос из кода сайта
  // frame.contentWindow.postMessage({ source: 'spraystore-host', type: 'send', text: 'Есть ли FLEXiO 590 в наличии?' }, '*');
</script>
</body>
</html>
