<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SprayStore — Чат поддержки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFD60A;
    --yellow-deep: #F5C400;
    --ink: #121212;
    --ink-2: #1C1C1C;
    --ink-3: #2A2A2A;
    --paper: #F6F5F2;
    --white: #FFFFFF;
    --muted: #8A8A8A;
    --line: #ECEAE5;
    --green: #2BD46B;
    --radius: 18px;
    --shadow: 0 30px 80px -20px rgba(0,0,0,.35), 0 10px 30px -10px rgba(0,0,0,.2);
    --ease: cubic-bezier(.2,.8,.2,1);
    --spring: cubic-bezier(.34,1.56,.64,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: Manrope, system-ui, -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Panel ---------- */
  /* Колонка контента: на широком iframe центрируется, на узком — во всю ширину */
  .ss-chat {
    --col: 760px;
    --gutter: max(16px, calc((100% - var(--col)) / 2));
    position: fixed; inset: 0; display: flex; flex-direction: column;
    background: var(--paper); animation: pageIn .6s var(--ease) both;
  }

  /* ---------- Приветственный экран ---------- */
  .ss-hero {
    text-align: center; padding: clamp(16px, 6vh, 56px) 0 12px; overflow: hidden;
    transition: opacity .4s var(--ease), transform .5s var(--ease), max-height .6s var(--ease), padding .6s var(--ease);
    max-height: 900px;
  }
  .ss-hero.gone { opacity: 0; transform: translateY(-16px) scale(.98); max-height: 0; padding: 0; }
  .ss-orb {
    position: relative; width: 140px; margin: 0 auto 14px; isolation: isolate;
    animation: float 5s ease-in-out infinite;
  }
  .ss-orb::before {
    content: ""; position: absolute; inset: 0 10%; border-radius: 50%; z-index: -1;
    background: radial-gradient(circle, rgba(255,214,10,.4), transparent 65%); filter: blur(14px);
    animation: glow 4s ease-in-out infinite alternate;
  }
  .ss-orb img { display: block; width: 100%; height: auto; }
  .ss-hero h1 { margin-top: 0; font-size: clamp(28px, 5vw, 44px); line-height: 1.05; font-weight: 800; letter-spacing: -.02em; }
  .ss-hero h1 span { background: linear-gradient(transparent 62%, var(--yellow) 62%); padding: 0 4px; }
  .ss-hero p { margin: 12px auto 0; max-width: 420px; color: #6f6c66; font-size: 14.5px; line-height: 1.55; }
  .ss-starters { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 28px; text-align: left; }
  .starter {
    display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); background: #fff; border-radius: 16px;
    padding: 14px; font: inherit; cursor: pointer; color: var(--ink); text-align: left;
    transition: transform .3s var(--spring), border-color .2s, box-shadow .3s;
    animation: msgIn .6s var(--spring) both;
  }
  .starter:nth-child(1) { animation-delay: .15s; } .starter:nth-child(2) { animation-delay: .22s; }
  .starter:nth-child(3) { animation-delay: .29s; } .starter:nth-child(4) { animation-delay: .36s; }
  .starter:hover { transform: translateY(-3px); border-color: var(--ink); box-shadow: 0 14px 30px -18px rgba(0,0,0,.35); }
  .starter .ic { flex: none; width: 38px; height: 38px; border-radius: 12px; background: var(--paper); display: grid; place-items: center; font-size: 18px; transition: background .2s; }
  .starter:hover .ic { background: var(--yellow); }
  .starter b { display: block; font-size: 13.5px; font-weight: 700; }
  .starter small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }

  .ss-mode-bar {
    flex: none; height: 3px; background: transparent; position: relative; overflow: hidden;
  }
  .ss-mode-bar::after {
    content: ""; position: absolute; inset: 0; width: 0; background: var(--yellow); transition: width .6s var(--ease);
  }
  .ss-chat[data-mode="connecting"] .ss-mode-bar::after { width: 40%; animation: loadbar 1.4s var(--ease) infinite; }
  .ss-chat[data-mode="operator"] .ss-mode-bar::after { width: 100%; background: var(--green); }

  .ss-bodywrap { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
  .ss-body {
    flex: 1; min-height: 0; overflow-y: auto; padding: 24px var(--gutter) 8px; background: var(--paper);
    overscroll-behavior: contain;
  }
  .ss-body::-webkit-scrollbar { width: 6px; }
  .ss-body::-webkit-scrollbar-thumb { background: #dcd9d2; border-radius: 3px; }

  .ss-day { text-align: center; font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin: 4px 0 16px; }

  .msg { display: flex; gap: 8px; margin-bottom: 10px; align-items: flex-end; animation: msgIn .45s var(--spring) both; }
  .msg .ava {
    flex: none; width: 26px; height: 26px; border-radius: 9px; font-size: 10px; font-weight: 800;
    display: grid; place-items: center; background: var(--ink); color: var(--yellow);
  }
  .msg.op .ava { background: #fff; color: var(--ink); border-radius: 50%; border: 1px solid var(--line); }
  .msg .ava.ghost { visibility: hidden; }
  .bubble {
    max-width: 78%; padding: 11px 14px; font-size: 14px; line-height: 1.5;
    background: #fff; border-radius: 16px 16px 16px 6px; border: 1px solid var(--line);
    word-wrap: break-word;
  }
  .bubble b { font-weight: 700; }
  .bubble .meta { display: block; font-size: 10.5px; color: var(--muted); margin-top: 4px; }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble { background: var(--ink); color: #fff; border-color: var(--ink); border-radius: 16px 16px 6px 16px; }
  .msg.user .bubble .meta { color: #8c8c8c; text-align: right; }

  .sys {
    display: flex; align-items: center; gap: 10px; margin: 14px 0; font-size: 12px; color: var(--muted);
    animation: msgIn .45s var(--ease) both;
  }
  .sys::before, .sys::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* typing */
  .typing .bubble { display: flex; align-items: center; gap: 9px; padding: 11px 14px; }
  .typing .spark { flex: none; width: 18px; height: 18px; color: var(--yellow-deep); animation: sparkSpin 2.4s linear infinite, sparkPulse 1.6s ease-in-out infinite; }
  .typing .think {
    font-size: 13.5px; font-weight: 600; color: transparent; white-space: nowrap;
    background: linear-gradient(100deg, #b9b5aa 30%, var(--ink) 50%, #b9b5aa 70%) 0 0 / 250% 100%;
    -webkit-background-clip: text; background-clip: text; animation: thinkShimmer 1.8s linear infinite;
  }
  .typing .think.swap { animation: thinkShimmer 1.8s linear infinite, thinkIn .35s var(--ease); }
  .typing .dots::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }

  /* streaming + rich text */
  .bubble.streaming::after {
    content: ""; display: inline-block; width: 7px; height: 14px; margin-left: 2px; vertical-align: -2px;
    background: var(--yellow-deep); border-radius: 2px; animation: caret .9s steps(2, start) infinite;
  }
  .bubble ul, .bubble ol { margin: 6px 0; padding-left: 20px; }
  .bubble li { margin: 2px 0; }
  .bubble .sp { height: 6px; }
  .bubble a { color: inherit; font-weight: 600; text-decoration: underline; text-decoration-color: var(--yellow-deep); text-decoration-thickness: 2px; text-underline-offset: 2px; }
  .bubble code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; background: var(--paper); padding: 1px 5px; border-radius: 5px; }
  .msg.user .bubble code { background: rgba(255,255,255,.14); }
  .code { margin: 8px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--paper); }
  .code-h { display: flex; justify-content: space-between; align-items: center; padding: 3px 4px 3px 10px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--line); background: #fff; }
  .code-h button { border: 0; background: none; font: inherit; font-size: 11px; font-weight: 700; color: var(--ink); cursor: pointer; padding: 5px 8px; border-radius: 6px; }
  .code-h button:hover { background: var(--paper); }
  .code pre { margin: 0; padding: 10px; overflow-x: auto; }
  .code pre code { background: none; padding: 0; }
  .src { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  .bubble .src a, .src .s { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 2px 8px; color: var(--ink); text-decoration: none; font-weight: 600; }

  /* ошибки */
  .msg.err .ava { background: #c0392b; color: #fff; }
  .msg.err .bubble { border-color: #f0c9c4; background: #fff6f5; }
  .err-act { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .err-act button { border: 0; font: inherit; font-size: 12.5px; font-weight: 700; padding: 8px 12px; border-radius: 9px; cursor: pointer; background: var(--ink); color: #fff; }
  .err-act button.ghost { background: none; color: var(--ink); border: 1px solid var(--line); }

  /* оценка ответа */
  .fb { margin: 8px -6px -4px; animation: msgIn .35s var(--ease) both; }
  .fb-row { display: flex; align-items: center; gap: 2px; opacity: .45; transition: opacity .2s; }
  .msg:hover .fb-row, .fb:focus-within .fb-row, .fb-row.has-state { opacity: 1; }
  @media (hover: none) { .fb-row { opacity: 1; } }
  .fb-row > button {
    border: 0; background: none; color: #a6a298; padding: 5px 6px; border-radius: 8px; cursor: pointer;
    display: grid; place-items: center; position: relative; transition: color .15s, background .15s;
  }
  .fb-row > button[hidden] { display: none; }
  .fb-row > button:hover { color: var(--ink); background: var(--paper); }
  .fb-row > button svg { width: 16px; height: 16px; fill: transparent; transition: fill .2s var(--ease); }
  .fb-row > button[aria-pressed="true"] { color: var(--ink); background: var(--yellow); }
  .fb-row > button.bad[aria-pressed="true"] { color: #fff; background: var(--ink); }
  .fb-row > button[aria-pressed="true"] svg { fill: currentColor; }
  .fb-row > button.pop { animation: fbPop .3s var(--spring); }
  .fb-row > button.bad.pop { animation: fbPopSoft .3s var(--ease); }
  .fb-row > button.pop:not(.bad)[data-v="like"]::after {
    content: ""; position: absolute; inset: 0; border-radius: 8px; border: 2px solid var(--yellow-deep);
    animation: fbRing .45s var(--ease) both; pointer-events: none;
  }
  .fb .sep { flex: 1; }
  .fb .note { font-size: 11.5px; color: var(--muted); margin-left: 6px; animation: msgIn .3s var(--ease) both; }
  .fb .note:empty { display: none; }
  .fb .note .lnk { border: 0; background: none; font: inherit; color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding: 2px 0; }

  .fb-panel {
    display: grid; grid-template-rows: 0fr; opacity: 0; visibility: hidden;
    transition: grid-template-rows .22s var(--ease), opacity .2s, visibility 0s linear .22s;
  }
  .fb-panel.open { grid-template-rows: 1fr; opacity: 1; visibility: visible; transition: grid-template-rows .22s var(--ease), opacity .2s, visibility 0s; }
  .fb-panel > div { overflow: hidden; min-height: 0; min-width: min(280px, 64vw); }
  .fb-panel h5 { font-size: 12px; font-weight: 700; margin: 10px 6px 6px; }
  .fb-panel .rs { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 6px; }
  .fb-panel .rs button {
    border: 1px solid var(--line); background: #fff; color: var(--ink); font: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 10px; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s, border-color .15s;
  }
  .fb-panel .rs button:hover { border-color: var(--ink); }
  .fb-panel .rs button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .fb-panel textarea {
    display: block; width: calc(100% - 12px); margin: 8px 6px 0; border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font: inherit; font-size: 12.5px; line-height: 1.4; resize: none; background: var(--paper); outline: 0; color: var(--ink);
  }
  .fb-panel textarea:focus { border-color: var(--ink); background: #fff; }
  .fb-panel .pa { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 6px 4px; }
  .fb-panel .go { border: 0; background: var(--ink); color: #fff; font: inherit; font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: 9px; cursor: pointer; }
  .fb-panel .human { border: 0; background: none; font: inherit; font-size: 12px; font-weight: 700; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding: 8px 2px; margin-left: auto; }

  /* Quick replies */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px 34px; animation: msgIn .5s var(--ease) both; }
  .chip {
    border: 1px solid var(--line); background: #fff; color: var(--ink); font: inherit; font-size: 13px; font-weight: 600;
    padding: 8px 12px; border-radius: 999px; cursor: pointer; transition: all .2s var(--ease);
  }
  .chip:hover { border-color: var(--ink); transform: translateY(-1px); }
  .chip.used { opacity: .4; pointer-events: none; }

  /* Product cards */
  .cards { display: flex; gap: 8px; overflow-x: auto; margin: 0 0 12px 34px; padding-bottom: 4px; scroll-snap-type: x mandatory; animation: msgIn .5s var(--ease) both; }
  .cards::-webkit-scrollbar { height: 0; }
  .pcard {
    flex: none; width: 168px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px;
    scroll-snap-align: start; transition: transform .25s var(--ease), border-color .2s; cursor: pointer; text-decoration: none; color: inherit;
  }
  .pcard:hover { transform: translateY(-3px); border-color: var(--ink); }
  .pcard .img { height: 76px; border-radius: 10px; background: linear-gradient(135deg, #fff8d6, #f3efe3); display: grid; place-items: center; font-size: 30px; margin-bottom: 10px; }
  .pcard .n { font-size: 12.5px; font-weight: 700; line-height: 1.3; min-height: 32px; }
  .pcard .p { margin-top: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 800; }
  .pcard .p span { width: 24px; height: 24px; border-radius: 7px; background: var(--yellow); display: grid; place-items: center; font-size: 12px; }

  /* Handoff card */
  .handoff {
    margin: 6px 0 14px 34px; background: var(--ink); color: #fff; border-radius: 18px; padding: 16px;
    position: relative; overflow: hidden; animation: popIn .6s var(--spring) both;
  }
  .handoff::before {
    content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px;
    background: linear-gradient(120deg, transparent 20%, var(--yellow), transparent 80%);
    background-size: 250% 100%; animation: shine 3s linear infinite;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .handoff .row { display: flex; gap: 12px; align-items: center; }
  .handoff .faces { display: flex; }
  .handoff .faces span {
    width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); margin-left: -8px;
    display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--ink);
  }
  .handoff .faces span:first-child { margin-left: 0; }
  .handoff h4 { font-size: 14px; font-weight: 700; }
  .handoff p { font-size: 12.5px; color: #a8a8a8; margin-top: 2px; line-height: 1.4; }
  .handoff .actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn {
    border: 0; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; border-radius: 10px; padding: 10px 14px;
    transition: transform .2s var(--ease), background .2s, opacity .2s;
  }
  .btn:active { transform: scale(.96); }
  .btn-yellow { background: var(--yellow); color: var(--ink); flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-yellow:hover { background: var(--yellow-deep); }
  .btn-ghost { background: rgba(255,255,255,.08); color: #fff; }
  .btn-ghost:hover { background: rgba(255,255,255,.15); }
  .handoff.done .actions { opacity: .35; pointer-events: none; }

  /* Connecting */
  .connecting { display: flex; align-items: center; gap: 12px; margin: 10px 0 14px 34px; padding: 14px; background: #fff; border: 1px dashed #d9d5cb; border-radius: 16px; font-size: 13px; animation: msgIn .45s var(--ease) both; }
  .spinner { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid #eee; border-top-color: var(--ink); animation: spin .8s linear infinite; flex: none; }
  .connecting small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

  /* Composer */
  .ss-foot { background: #fff; border-top: 1px solid var(--line); padding: 12px var(--gutter) max(10px, env(safe-area-inset-bottom)); }
  .composer {
    display: flex; align-items: flex-end; gap: 8px; background: var(--paper); border: 1.5px solid transparent;
    border-radius: 16px; padding: 6px 6px 6px 14px; transition: border-color .2s, background .2s;
  }
  .composer:focus-within { border-color: var(--ink); background: #fff; }
  .composer textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: transparent; font: inherit; font-size: 14px;
    line-height: 1.45; padding: 8px 0; max-height: 120px; color: var(--ink);
  }
  .composer textarea::placeholder { color: #a5a29b; }
  .send {
    flex: none; width: 38px; height: 38px; border-radius: 12px; border: 0; cursor: pointer;
    background: var(--ink); color: var(--yellow); display: grid; place-items: center;
    transition: transform .25s var(--spring), opacity .2s, background .2s;
  }
  .send:disabled { opacity: .25; cursor: default; }
  .send.stop { background: var(--yellow); color: var(--ink); }
  .send:not(:disabled):hover { transform: scale(1.06) rotate(-8deg); }
  .ss-hint { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #a5a29b; margin-top: 8px; padding: 0 4px; }
  .ss-hint .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); margin-right: 6px; vertical-align: 1px; transition: background .3s; }
  .ss-chat[data-mode="operator"] .ss-hint .dot { background: var(--green); }
  .ss-hint > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; }
  .ss-hint .acts { display: flex; gap: 12px; flex: none; }
  .ss-hint #ssReset { text-decoration: none; display: grid; place-items: center; opacity: .55; transition: opacity .2s, transform .4s var(--ease); }
  .ss-hint #ssReset:hover { opacity: 1; transform: rotate(-90deg); }
  .ss-hint button[hidden] { display: none; }
  .ss-hint button { border: 0; background: none; font: inherit; color: var(--ink); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  /* «↓ новые сообщения» */
  .ss-jump {
    position: absolute; left: 50%; bottom: 12px; transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
    background: var(--ink); color: #fff; border: 0; font: inherit; font-size: 12.5px; font-weight: 700; padding: 9px 14px;
    border-radius: 999px; box-shadow: 0 10px 24px -10px rgba(0,0,0,.5); cursor: pointer; transition: opacity .2s, transform .3s var(--spring);
  }
  .ss-jump.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }

  /* оценка диалога (CSAT) */
  .csat {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; background: #fff; border-top: 1px solid var(--line);
    padding: 18px var(--gutter) max(18px, env(safe-area-inset-bottom)); box-shadow: 0 -20px 50px -20px rgba(0,0,0,.3);
    text-align: center; transform: translateY(100%); transition: transform .35s var(--spring);
  }
  .csat.show { transform: none; }
  .csat h4 { font-size: 15px; font-weight: 800; }
  .csat p { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .stars { display: flex; justify-content: center; gap: 2px; margin: 10px 0 4px; }
  .stars button { width: 44px; height: 44px; border: 0; background: none; cursor: pointer; font-size: 30px; line-height: 1; color: #d9d5cb; transition: color .15s, transform .2s var(--spring); }
  .stars button.on { color: var(--yellow-deep); }
  .stars button:hover { transform: scale(1.15); }
  .csat .skip { border: 0; background: none; font: inherit; font-size: 12px; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 10px; }

  .ss-disc { margin: 6px 4px 0; font-size: 10.5px; line-height: 1.35; color: #a5a29b; text-align: center; }
  button:focus-visible, a:focus-visible, .chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ---------- Animations ---------- */
  @keyframes pageIn { from { opacity: 0; } }
  @keyframes float { 50% { transform: translateY(-6px) rotate(-2deg); } }
  @keyframes glow { to { transform: scale(1.2); opacity: .7; } }
  @keyframes msgIn { from { opacity: 0; transform: translateY(10px) scale(.98); } }
  @keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.94); } }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
  @keyframes fbPop { 0% { transform: scale(1); } 45% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes fbPopSoft { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  @keyframes fbRing { from { opacity: .7; transform: scale(.8); } to { opacity: 0; transform: scale(1.7); } }
  @keyframes sparkSpin { to { transform: rotate(360deg); } }

<script>
(() => {
  /* =====================================================================
   *  КОНФИГ — точка расширения. Подключите реальные эндпоинты здесь.
   * ===================================================================== */
  const CONFIG = {
    brand: 'SprayStore',
    logo: 'https://avatars.mds.yandex.net/get-yastore/18780052/lnlpc4ck68chnlfs8lc5fgr6vkw7sfxh/x160',
    handoffAfter: 3,          // после скольких вопросов предложить живого специалиста
    reofferEvery: 3,          // если отказались — повторно предложить через N вопросов
    // Origin сайта-родителя для postMessage. '*' — любой; на проде укажите 'https://spraystore.ru'
    parentOrigin: '*',
    storageKey: 'ss_chat_v1',
    ai: {
      endpoint: '/api/chat',   // RAG-сервис (service/api.py); null — вернуться на мок
      feedbackEndpoint: '/api/feedback',
      csatEndpoint: '/api/csat',
      timeoutMs: 30000,       // дольше — показываем ошибку с «Повторить»
      typingSpeed: [600, 1400]
    },
    csatRate: 0.4,            // доля диалогов, где при «Новом диалоге» просим оценку 1–5
    csatMinUserMsgs: 2,
    operator: {
      endpoint: null,         // напр. 'wss://support.spraystore.ru/ws' — если null, мок
      name: 'Анна',
      role: 'Специалист SprayStore',
      initials: 'А'
    },
    links: {
      telegram: 'https://t.me/',
      catalog: '#catalog'
    }
  };

  /* =====================================================================
   *  ТРАНСПОРТ — заменить мок-реализации на реальные запросы.
   * ===================================================================== */
  const AIProvider = {
    /** @returns {Promise<{text:string, chips?:string[], cards?:object[], confident?:boolean}>} */
    async reply(text, history, signal) {
      if (CONFIG.ai.endpoint) {
        const r = await fetch(CONFIG.ai.endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text, session_id: state.sessionId,
            history: history.map(h => ({ role: h.role, text: h.text }))
          }),
          signal
        });
        if (!r.ok) throw new Error('http ' + r.status);
        return r.json();
      }
      return MockAI.answer(text);
    }
  };

  const postJSON = (url, body) => fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), keepalive: true
  }).then(r => { if (!r.ok) throw new Error('http ' + r.status); });

  const OperatorProvider = {
    listeners: [],
    onMessage(fn) { this.listeners.push(fn); },
    emit(msg) { this.listeners.forEach(fn => fn(msg)); },
    /** Передаёт оператору историю диалога, чтобы клиенту не повторять вопрос */
    async connect(history) {
      if (CONFIG.operator.endpoint) {
        // TODO: this.ws = new WebSocket(CONFIG.operator.endpoint);
        //       this.ws.onmessage = e => this.emit(JSON.parse(e.data));
        //       this.ws.onopen = () => this.ws.send(JSON.stringify({ type:'handoff', history }));
      }
      await wait(2600 + Math.random() * 1200);
      return { name: CONFIG.operator.name, role: CONFIG.operator.role, initials: CONFIG.operator.initials };
    },
    async send(text) {
      if (this.ws) return this.ws.send(JSON.stringify({ type: 'message', text }));
      // мок ответа оператора
      await wait(1800 + Math.random() * 1500);
      this.emit({ text: MockOperator.answer(text) });
    }
  };

  /* =====================================================================
   *  МОК-БАЗА ЗНАНИЙ
   * ===================================================================== */
  const PRODUCTS = {
    flexio: { name: 'Wagner FLEXiO 590', price: '12 990 ₽', icon: '🔫' },
    w100:   { name: 'Wagner W 100', price: '6 490 ₽', icon: '🎨' },
    xvlp:   { name: 'Wagner XVLP 1250', price: '18 990 ₽', icon: '💨' },
    ctrl:   { name: 'Wagner Control Pro 250M', price: '64 900 ₽', icon: '⚙️' },
    hg:     { name: 'Фен Wagner Furno 500', price: '4 790 ₽', icon: '🔥' }
  };

  const INTENTS = [
    { re: /(привет|здравств|добр(ый|ое)|хай|hello)/i,
      text: 'Привет! Я помогу подобрать оборудование, расскажу про доставку, оплату и гарантию. Что красим?',
      chips: ['Стены в квартире', 'Забор / фасад', 'Мебель и двери'] },
    { re: /(подобрать|выбрать|подбор|какой краскопульт|^краскопульт)/i,
      text: 'С удовольствием! Подскажите, что планируете красить — от этого зависит тип аппарата и насадка.',
      chips: ['Стены в квартире', 'Забор / фасад', 'Мебель и двери'] },
    { re: /(стен|потол|квартир|интерьер|комнат)/i,
      text: 'Для стен и потолков лучше всего подойдёт краскопульт с насадкой для водоэмульсионных красок. Обратите внимание на **FLEXiO 590** — две насадки в комплекте, ровный факел без брызг. Для больших объёмов (от 100 м²) — безвоздушный **Control Pro 250M**.',
      cards: ['flexio', 'ctrl'], chips: ['А что дешевле?', 'Какую краску брать?'] },
    { re: /(забор|фасад|улиц|дом|дач|сарай)/i,
      text: 'Для фасадов и заборов важна производительность. Рекомендую **XVLP 1250** — справится с антисептиками, лаками и фасадными красками. Для штакетника отлично подходит узкий вертикальный факел.',
      cards: ['xvlp', 'flexio'], chips: ['Сколько краски уйдёт?', 'Есть доставка?'] },
    { re: /(мебел|двер|шкаф|лак|дерев|морил)/i,
      text: 'Для мебели и дверей нужна тонкая настройка факела. **W 100** — лёгкий и точный, идеален для лаков, морилок и масел. Совет: разбавляйте лак на 5–10% и держите пистолет в 20–25 см от поверхности.',
      cards: ['w100', 'flexio'], chips: ['Как разбавлять краску?', 'Гарантия?'] },
    { re: /(дешев|бюджет|недорог|цена|стоим|сколько стоит)/i,
      text: 'Самый доступный вариант — **W 100** за 6 490 ₽. И не забудьте промокод **HELLO** — −10% на первый заказ 🎁',
      cards: ['w100'], chips: ['Как применить промокод?'] },
    { re: /(промокод|скидк|hello|акци)/i,
      text: 'Промокод **HELLO** даёт −10% на первый заказ. Введите его в корзине в поле «Промокод» перед оформлением.',
      chips: ['Как оплатить?', 'Доставка'] },
    { re: /(достав|привез|курьер|самовывоз|сдэк|почт)/i,
      text: 'Доставляем по всей России: курьером, СДЭК и в пункты выдачи. По Москве — 1–2 дня, в регионы — 2–7 дней. Также можно купить нас на **Ozon**.',
      chips: ['Сколько стоит доставка?', 'Как оплатить?'] },
    { re: /(оплат|карт|налич|рассроч|счет|счёт|юр)/i,
      text: 'Оплатить можно картой онлайн, через СБП или при получении. Для юрлиц выставляем счёт с НДС.',
      chips: ['Гарантия?', 'Доставка'] },
    { re: /(гаранти|сломал|ремонт|сервис|не работ|возврат|брак)/i,
      text: 'На всё оборудование Wagner — официальная гарантия от 1 года. Если что-то не работает, лучше сразу разобраться со специалистом: он оформит сервис или замену.',
      chips: ['Связаться со специалистом'], forceHandoff: true },
    { re: /(разбав|вязк|какую краск|краску брать|сопл|насадк|форсунк)/i,
      text: 'Проверьте вязкость воронкой из комплекта: для водоэмульсии — 25–35 сек, для лаков — 15–20 сек. Разбавляйте постепенно, по 5%, водой или растворителем по типу краски.',
      chips: ['А для фасада?', 'Позвать специалиста'] },
    { re: /(расход|сколько краски|литр|м2|м²|квадрат)/i,
      text: 'Ориентир — 1 литр на 6–10 м² в один слой, зависит от фактуры. Напишите площадь, и я прикину точнее.',
      chips: ['30 м²', '80 м²', '150 м²'] },
    { re: /(\d+)\s*(м2|м²|кв|метр)/i,
      fn: m => { const s = +m[1]; const min = Math.ceil(s / 10 * 2), max = Math.ceil(s / 6 * 2);
        return { text: `Для **${s} м²** в два слоя понадобится примерно **${min}–${max} л** краски. ${s > 100 ? 'При таком объёме стоит присмотреться к безвоздушному аппарату — сэкономите часы работы.' : 'Ручного краскопульта будет достаточно.'}`,
                 cards: s > 100 ? ['ctrl'] : ['flexio'] }; } },
    { re: /(фен|строительн|снять краск)/i,
      text: 'Строительный фен пригодится для снятия старой краски и сушки. Хорошо зарекомендовал себя **Furno 500**.',
      cards: ['hg'] },
    { re: /(ozon|озон|маркетплейс)/i,
      text: 'Да, мы есть на Ozon — ищите магазин SprayStore. Но на сайте действует промокод HELLO 😉' },
    { re: /(спасиб|благодар|отлично|супер)/i,
      text: 'Рад помочь! Если появятся вопросы — я здесь 🙌' }
  ];

  const MockAI = {
    answer(text) {
      for (const it of INTENTS) {
        const m = text.match(it.re);
        if (m) return { confident: true, ...(it.fn ? it.fn(m) : it) };
      }
      return {
        confident: false,
        text: 'Хороший вопрос! Точно ответить не могу — возможно, это лучше уточнить у специалиста. Могу пока подсказать по выбору, доставке или оплате.',
        chips: ['Подобрать краскопульт', 'Доставка', 'Позвать специалиста']
      };
    }
  };

  const MockOperator = {
    i: 0,
    answer() {
      const r = [
        'Поняла вас. Сейчас уточню наличие на складе, буквально минуту 🙂',
        'Да, всё в наличии. Могу оформить заказ прямо здесь или отправить ссылку на корзину с уже применённой скидкой.',
        'Записала. Если удобнее — продублирую информацию в Telegram или на почту.',
        'Хорошо! Если что-то ещё понадобится — пишите, я на связи.'
      ];
      return r[this.i++ % r.length];
    }
  };

  /* =====================================================================
   *  СОСТОЯНИЕ
   * ===================================================================== */
  const state = {
    open: false,
    mode: 'ai',            // 'ai' | 'connecting' | 'operator'
    userCount: 0,          // кол-во вопросов в режиме ИИ
    lowConfidence: 0,      // сколько раз ИИ «не понял»
    sessionId: (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10)),
    csatDone: false,
    nextOfferAt: CONFIG.handoffAfter,
    operator: null,
    history: []            // {role, text, ts, extra?}
  };

  const $ = id => document.getElementById(id);
  const el = { chat: $('ssChat'), body: $('ssBody'), input: $('ssInput'), send: $('ssSend'), form: $('ssForm'),
    hint: $('ssHintText'), humanLink: $('ssHumanLink') };

  const wait = ms => new Promise(r => setTimeout(r, ms));
  const rand = ([a, b]) => a + Math.random() * (b - a);
  const time = ts => new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
  const SEND_ICON = el.send.innerHTML;
  const STOP_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>';
  let busy = false;          // идёт генерация ответа
  let gen = null;            // { ctrl, stopped, timedOut } текущего запроса
  let stick = true;          // лента прижата к низу → автоскролл
  let hasNew = false;

  /** Мини-markdown: **жирный**, `код`, ```блоки```, списки, ссылки */
  function md(src) {
    const codes = [];
    let t = src.replace(/```([\w+-]*)[ \t]*\n?([\s\S]*?)(?:```|$)/g, (_, lang, code) => {
      codes.push({ lang, code: code.replace(/\n$/, '') });
      return `\n\u0000${codes.length - 1}\u0000\n`;
    });
    t = esc(t)
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
    const out = []; let list = null;
    const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
    const openList = tag => { if (list !== tag) { closeList(); out.push(`<${tag}>`); list = tag; } };
    for (const line of t.split('\n')) {
      let m;
      if ((m = line.match(/^\s*[-*•—–]\s+(.*)$/))) { openList('ul'); out.push(`<li>${m[1]}</li>`); }
      else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { openList('ol'); out.push(`<li>${m[1]}</li>`); }
      else {
        closeList();
        const c = line.match(/^\u0000(\d+)\u0000$/);
        if (c) {
          const { lang, code } = codes[+c[1]];
          out.push(`<div class="code"><div class="code-h"><span>${esc(lang || 'код')}</span><button type="button">Копировать</button></div><pre><code>${esc(code)}</code></pre></div>`);
        } else if (!line.trim()) { if (out.length && out[out.length - 1] !== '<div class="sp"></div>') out.push('<div class="sp"></div>'); }
        else out.push(line + '<br>');
      }
    }
    closeList();
    return out.join('').replace(/<br>(?=<(?:ul|ol|div)|$)/g, '');
  }

  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); }
    catch (e) {   // в iframe без разрешения clipboard API недоступен
      const ta = document.createElement('textarea');
      ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      ta.remove();
    }
  }

  /* ---------- Persist ---------- */
  function save() {
    try {
      const { open, ...rest } = state;
      localStorage.setItem(CONFIG.storageKey, JSON.stringify(rest));
    } catch (e) {}
  }
  function load() {
    try { const s = JSON.parse(localStorage.getItem(CONFIG.storageKey)); if (s && s.history) return s; } catch (e) {}
    return null;
  }

  /* =====================================================================
   *  РЕНДЕР
   * ===================================================================== */
  const jump = $('ssJump');
  el.body.addEventListener('scroll', () => {
    stick = el.body.scrollHeight - el.body.scrollTop - el.body.clientHeight < 80;
    if (stick) hasNew = false;
    jump.classList.toggle('show', !stick && hasNew);
  });
  /** Автоскролл только если пользователь внизу; иначе показываем «↓ Новые сообщения» */
  function scrollDown(force) {
    requestAnimationFrame(() => {
      if (force === true || stick) { el.body.scrollTop = el.body.scrollHeight; stick = true; hasNew = false; jump.classList.remove('show'); }
      else { hasNew = true; jump.classList.add('show'); }
    });
  }
  jump.onclick = () => el.body.scrollTo({ top: el.body.scrollHeight, behavior: 'smooth' });
  el.body.addEventListener('click', e => {   // «Копировать» в блоках кода
    const b = e.target.closest('.code-h button');
    if (!b) return;
    copyText(b.closest('.code').querySelector('code').textContent);
    b.textContent = 'Скопировано ✓';
    setTimeout(() => { b.textContent = 'Копировать'; }, 1500);
  });

  function lastSender() {
    const last = el.body.lastElementChild;
    return last && last.classList.contains('msg') ? last.dataset.role : null;
  }

  const ICONS = {
    like: '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v11H3V10h4zM7 10l4-8a2.5 2.5 0 0 1 2.5 2.5V8H19a2 2 0 0 1 2 2.3l-1.2 7.5A2 2 0 0 1 17.8 19H7"/></svg>',
    dislike: '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 14V3h4v11h-4zM17 14l-4 8a2.5 2.5 0 0 1-2.5-2.5V16H5a2 2 0 0 1-2-2.3l1.2-7.5A2 2 0 0 1 6.2 5H17"/></svg>',
    flag: '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
    copy: '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V5.5A2.5 2.5 0 0 1 7.5 3H15"/></svg>',
    regen: '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9L20 8"/><path d="M20 3v5h-5"/></svg>'
  };
  const REASONS = {
    dislike: ['Неверный ответ', 'Не по теме', 'Устаревшая информация', 'Непонятно', 'Грубый тон', 'Другое'],
    report: ['Оскорбительный ответ', 'Небезопасный совет', 'Личные данные', 'Другое']
  };

  /** Оценка уходит в /api/feedback; без бэкенда (мок) — только локальное состояние */
  function sendFeedback(item) {
    if (!CONFIG.ai.endpoint) return Promise.resolve();
    const f = item.fb, idx = state.history.indexOf(item);
    return postJSON(CONFIG.ai.feedbackEndpoint, {
      message_id: item.id, session_id: state.sessionId, value: f.v, reasons: f.reasons, comment: f.comment,
      escalated: !!f.escalated, user_msgs_before: state.history.slice(0, idx + 1).filter(h => h.role === 'user').length
    });
  }

  function renderFeedback(item) {
    if (typeof item.fb === 'string') item.fb = { v: item.fb === 'reported' ? 'report' : item.fb, reasons: [], comment: '' };
    const f = item.fb = item.fb || { v: null, reasons: [], comment: '' };
    const fb = document.createElement('div');
    fb.className = 'fb';
    fb.innerHTML = `
      <div class="fb-row" role="group" aria-label="Оценка ответа">
        <button type="button" data-v="like" title="Полезный ответ" aria-label="Полезный ответ">${ICONS.like}</button>
        <button type="button" data-v="dislike" class="bad" title="Неполезный ответ" aria-label="Неполезный ответ">${ICONS.dislike}</button>
        <button type="button" data-a="copy" title="Копировать" aria-label="Копировать ответ">${ICONS.copy}</button>
        <button type="button" data-a="regen" title="Сгенерировать заново" aria-label="Сгенерировать заново" hidden>${ICONS.regen}</button>
        <span class="note" role="status"></span><span class="sep"></span>
        <button type="button" data-v="report" title="Пожаловаться" aria-label="Пожаловаться">${ICONS.flag}</button>
      </div>
      <div class="fb-panel" inert><div></div></div>`;
    const row = fb.querySelector('.fb-row'), note = fb.querySelector('.note');
    const panel = fb.querySelector('.fb-panel'), inner = panel.firstElementChild;

    const paint = () => {
      fb.querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', String(f.v === b.dataset.v)));
      row.classList.toggle('has-state', !!f.v);
    };
    const setNote = (t, linkLabel, linkFn) => {
      note.textContent = t || '';
      if (t && linkLabel) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'lnk'; b.textContent = linkLabel; b.onclick = linkFn;
        note.append(' ', b);
      }
    };
    const closePanel = () => { panel.classList.remove('open'); panel.inert = true; };
    const likeNote = () => setNote('Спасибо!', 'Добавить комментарий', () => openPanel('like'));

    function openPanel(mode) {
      const reasons = REASONS[mode];
      setNote('');
      inner.innerHTML = `
        <h5>${mode === 'like' ? 'Что понравилось? Необязательно' : mode === 'dislike' ? 'Что пошло не так?' : 'На что жалуетесь?'}</h5>
        ${reasons ? `<div class="rs">${reasons.map(r => `<button type="button" aria-pressed="${f.reasons.includes(r)}">${esc(r)}</button>`).join('')}</div>` : ''}
        <textarea rows="2" maxlength="1000" placeholder="${mode === 'like' ? 'Комментарий' : 'Расскажите подробнее (необязательно)'}" aria-label="Комментарий">${esc(f.comment)}</textarea>
        <div class="pa"><button type="button" class="go">Отправить</button>${mode === 'dislike' ? '<button type="button" class="human">Позвать человека</button>' : ''}</div>`;
      const ta = inner.querySelector('textarea');
      inner.querySelectorAll('.rs button').forEach(b => b.onclick = () => {
        const r = b.textContent, on = !f.reasons.includes(r);
        f.reasons = on ? [...f.reasons, r] : f.reasons.filter(x => x !== r);
        b.setAttribute('aria-pressed', String(on));
      });
      const submitPanel = () => { f.comment = ta.value.trim(); save(); sendFeedback(item).catch(() => {}); closePanel(); };
      inner.querySelector('.go').onclick = () => { submitPanel(); setNote(mode === 'like' ? 'Спасибо!' : 'Спасибо, это поможет улучшить ответы'); };
      const human = inner.querySelector('.human');
      if (human) human.onclick = () => { f.escalated = true; submitPanel(); setNote('Подключаем специалиста…'); startHandoff(); };
      panel.inert = false; panel.classList.add('open');
      scrollDown(); setTimeout(scrollDown, 260);   // и после раскрытия панели
    }

    fb.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
      const v = b.dataset.v, prev = JSON.stringify(f);
      f.reasons = []; f.comment = ''; f.escalated = false;
      f.v = f.v === v ? null : v;              // повторный клик снимает оценку
      paint();
      if (f.v) {
        b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
        if (matchMedia('(pointer: coarse)').matches) navigator.vibrate?.(10);
      }
      if (f.v === 'like') { closePanel(); likeNote(); }
      else if (f.v) openPanel(f.v);            // дизлайк / жалоба → причины
      else { closePanel(); setNote(''); }
      save();
      // оптимистично: UI уже обновлён, при ошибке запроса тихо откатываем
      sendFeedback(item).catch(() => { Object.assign(f, JSON.parse(prev)); paint(); closePanel(); setNote(''); save(); });
    });
    fb.querySelector('[data-a="copy"]').onclick = async () => {
      await copyText(item.text);
      setNote('Скопировано ✓');
      setTimeout(() => { if (note.textContent.startsWith('Скопировано')) f.v === 'like' ? likeNote() : setNote(''); }, 1500);
    };
    fb.querySelector('[data-a="regen"]').onclick = () => regenerate(item, fb.closest('.msg'));

    paint();
    if (f.v === 'like') setNote('Спасибо!');
    return fb;
  }

  /** «Сгенерировать заново»: убираем последний ответ и спрашиваем ту же реплику ещё раз */
  function regenerate(item, node) {
    if (busy) return;
    const i = state.history.indexOf(item);
    const q = state.history.slice(0, i).reverse().find(h => h.role === 'user');
    if (i < 0 || !q) return;
    state.history.splice(i, 1);
    for (let n = node.nextElementSibling; n && n.matches('.chips, .cards');) { const nx = n.nextElementSibling; n.remove(); n = nx; }
    node.remove();
    save();
    stick = true;
    ask(q.text);
  }

  /** «Заново» доступно только у последнего ответа ИИ и пока не идёт генерация */
  function refreshRegen() {
    el.body.querySelectorAll('[data-a="regen"]').forEach(b => { b.hidden = true; });
    const last = [...el.body.querySelectorAll('.msg.bot')].pop();
    const btn = last && last.querySelector('[data-a="regen"]');
    if (btn && !busy) btn.hidden = false;
  }

  const srcHtml = list => !list?.length ? '' :
    `<div class="src"><span>Источники:</span>${list.map(x => {
      const title = esc(String(x.title).replace(/^./, c => c.toUpperCase()));
      return /^https?:\/\//.test(x.url || '') ? `<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${title}</a>` : `<span class="s">${title}</span>`;
    }).join('')}</div>`;

  /** Плавная «печать» ответа: слово за словом; кнопка «Остановить» обрывает её на текущем месте */
  async function streamInto(bubble, item, tail, fb) {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const parts = item.text.match(/\s+|\S+/g) || [];
    const tick = 32, maxMs = 3500;
    const step = Math.max(1, Math.ceil(parts.length / (maxMs / tick)));
    const g = gen;
    let shown = parts.length;
    bubble.classList.add('streaming');
    bubble.setAttribute('aria-busy', 'true');
    for (let i = 0; i < parts.length && !reduce; i += step) {
      if (g?.stopped || !bubble.isConnected) { shown = i; break; }
      let part = parts.slice(0, i + step).join('');
      if ((part.match(/\*\*/g) || []).length % 2) part += '**';   // не мигать незакрытым **
      bubble.innerHTML = md(part);
      scrollDown();
      await wait(tick + Math.random() * 18);
    }
    if (shown < parts.length) {
      item.text = parts.slice(0, shown).join('').trimEnd();
      item.stopped = true;
      if (!item.text) {   // остановили до первого слова — ответа как бы не было
        bubble.closest('.msg')?.remove();
        const i = state.history.indexOf(item);
        if (i >= 0) state.history.splice(i, 1);
        save(); return;
      }
      save();
    }
    bubble.innerHTML = md(item.text) + tail();
    if (fb) bubble.appendChild(fb);
    bubble.classList.remove('streaming');
    bubble.removeAttribute('aria-busy');
    scrollDown();
  }

  function renderMessage(item, { stream = false } = {}) {
    const { role, text, ts } = item;
    if (role === 'system') {
      const d = document.createElement('div');
      d.className = 'sys'; d.textContent = text;
      el.body.appendChild(d); return scrollDown();
    }
    const grouped = lastSender() === role;
    const m = document.createElement('div');
    m.className = 'msg ' + role;
    m.dataset.role = role;
    if (role !== 'user') {
      const ava = document.createElement('div');
      ava.className = 'ava';
      ava.textContent = role === 'op' ? (state.operator?.initials || 'А') : 'AI';
      // в серии сообщений аватар остаётся только у последнего
      if (grouped) el.body.lastElementChild.querySelector('.ava')?.classList.add('ghost');
      m.appendChild(ava);
    }
    const b = document.createElement('div');
    b.className = 'bubble';
    const tail = () => srcHtml(item.sources) + `<span class="meta">${time(ts)}${item.stopped ? ' · остановлено' : ''}</span>`;
    const fb = role === 'bot' && !item.local ? renderFeedback(item) : null;
    m.appendChild(b);
    el.body.appendChild(m);
    if (stream) return streamInto(b, item, tail, fb).then(refreshRegen);
    b.innerHTML = md(text) + tail();
    if (fb) b.appendChild(fb);
    refreshRegen();
    scrollDown();
  }

  function renderChips(chips) {
    if (!chips?.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'chips';
    chips.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'chip'; btn.type = 'button'; btn.textContent = c;
      btn.onclick = () => { wrap.querySelectorAll('.chip').forEach(x => x.classList.add('used')); submit(c); };
      wrap.appendChild(btn);
    });
    el.body.appendChild(wrap); scrollDown();
  }

  // ids — либо id из мок-словаря PRODUCTS, либо объекты товаров с сервера: {id, name, price, url, image?, in_stock}
  const safeUrl = u => (typeof u === 'string' && /^https?:\/\//i.test(u)) ? u : '';
  function renderCards(items) {
    if (!items?.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'cards';
    items.forEach(it => {
      const a = document.createElement('a');
      a.className = 'pcard';
      if (typeof it === 'string') {   // мок-режим как раньше
        const p = PRODUCTS[it]; if (!p) return;
        a.href = CONFIG.links.catalog;
        a.innerHTML = `<div class="img">${p.icon}</div><div class="n">${esc(p.name)}</div><div class="p">${p.price}<span>→</span></div>`;
      } else if (it && typeof it === 'object' && it.name) {   // реальный товар из каталога
        const href = safeUrl(it.url), img = safeUrl(it.image);
        a.href = href || CONFIG.links.catalog;
        if (href) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
        const price = typeof it.price === 'number' ? Math.round(it.price).toLocaleString('ru-RU') + ' ₽' : 'цена по запросу';
        a.innerHTML = `<div class="img">${img ? `<img src="${esc(img)}" alt="" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:10px">` : '🔫'}</div>` +
          `<div class="n">${esc(String(it.name))}</div><div class="p">${esc(price)}<span>→</span></div>`;
        const im = a.querySelector('img');
        if (im) im.onerror = () => { im.parentNode.textContent = '🔫'; };
      } else return;
      wrap.appendChild(a);
    });
    if (!wrap.children.length) return;
    el.body.appendChild(wrap); scrollDown();
  }

  function showTyping() {
    const t = document.createElement('div');
    t.className = 'msg typing ' + (state.mode === 'operator' ? 'op' : 'bot');
    if (state.mode === 'operator') {
      t.innerHTML = `<div class="ava">${state.operator.initials}</div><div class="bubble"><span class="think dots">печатает</span></div>`;
      el.body.appendChild(t); scrollDown();
      return () => t.remove();
    }
    const phrases = ['Думаю', 'Ищу в базе знаний', 'Подбираю ответ', 'Формулирую'];
    t.innerHTML = `<div class="ava">AI</div><div class="bubble">
      <svg class="spark" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5c.5 5.2 2.2 8.7 5 10.5-2.8 1.8-4.5 5.3-5 10.5-.5-5.2-2.2-8.7-5-10.5 2.8-1.8 4.5-5.3 5-10.5z"/></svg>
      <span class="think dots">${phrases[0]}</span></div>`;
    el.body.appendChild(t); scrollDown();
    const label = t.querySelector('.think');
    let i = 0;
    const iv = setInterval(() => {
      label.textContent = phrases[i = (i + 1) % phrases.length];
      label.classList.remove('swap'); void label.offsetWidth; label.classList.add('swap');
    }, 1800);
    return () => { clearInterval(iv); t.remove(); };
  }

  function renderHandoffOffer(reason) {
    const card = document.createElement('div');
    card.className = 'handoff';
    card.innerHTML = `
      <div class="row">
        <div class="faces">
          <span style="background:#FFD60A">А</span><span style="background:#fff">М</span><span style="background:#e9e5da">Д</span>
        </div>
        <div>
          <h4>${reason === 'fail' ? 'Давайте подключу специалиста' : 'Хотите обсудить с живым специалистом?'}</h4>
          <p>Продолжим прямо здесь — он увидит всю переписку. Среднее время ответа ~2 мин.</p>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-yellow" data-a="yes">Подключить
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <button class="btn btn-ghost" data-a="no">Продолжить с ИИ</button>
      </div>`;
    emit('handoff_offer', { reason });
    card.querySelector('[data-a="yes"]').onclick = () => { card.classList.add('done'); startHandoff(); };
    card.querySelector('[data-a="no"]').onclick = () => {
      card.classList.add('done');
      state.nextOfferAt = state.userCount + CONFIG.reofferEvery;
      botSay({ text: 'Хорошо, продолжаем! Кнопка «Позвать человека» всегда внизу 👇' }, { local: true });
    };
    el.body.appendChild(card); scrollDown();
  }

  function setMode(mode) {
    state.mode = mode;
    el.chat.dataset.mode = mode;
    if (mode === 'ai') el.hint.textContent = busy ? 'ИИ-помощник · печатает…' : 'ИИ-помощник · онлайн';
    else if (mode === 'connecting') el.hint.textContent = 'Подключаем специалиста…';
    else if (mode === 'operator') el.hint.textContent = `${state.operator.name} · специалист`;
    el.humanLink.hidden = mode !== 'ai';
    el.input.placeholder = mode === 'connecting' ? 'Можно писать — специалист увидит…' : 'Напишите вопрос…';
  }

  /* =====================================================================
   *  ЛОГИКА
   * ===================================================================== */
  function push(role, text, extra) {
    const item = { id: uid(), role, text, ts: Date.now(), ...(extra || {}) };
    state.history.push(item);
    save();
    return item;
  }

  async function botSay(res, { local = false } = {}) {
    const isAI = state.mode !== 'operator';
    const item = push(isAI ? 'bot' : 'op', res.text, { chips: res.chips, cards: res.cards, sources: res.sources, ...(res.message_id ? { id: res.message_id } : {}), ...(local ? { local: true } : {}) });
    await renderMessage(item, { stream: isAI });
    emit('message', { role: item.role, text: item.text });
    renderCards(res.cards);
    renderChips(res.chips);
  }

  const HUMAN_RE = /(оператор|человек|менеджер|специалист|живо|консультант)/i;

  async function submit(raw) {
    const text = raw.trim();
    if (!text) return;
    hideHero();
    el.body.querySelectorAll('.msg.err').forEach(n => n.remove());
    stick = true;
    renderMessage(push('user', text));
    emit('user_message', { text });

    // В режиме специалиста сообщения уходят оператору (при подключении — просто копятся в истории)
    if (state.mode === 'operator') return OperatorProvider.send(text);
    if (state.mode === 'connecting') return;

    // Явная просьба о человеке — сразу подключаем
    if (HUMAN_RE.test(text)) return startHandoff();

    state.userCount++;
    await ask(text);
  }

  /** Один цикл «вопрос → ответ ИИ»: индикатор, запрос с таймаутом, ошибки с повтором, стриминг */
  async function ask(text) {
    const sid = state.sessionId;
    const stop = showTyping();
    scrollDown(true);
    const ctrl = new AbortController();
    const g = gen = { ctrl, stopped: false, timedOut: false };
    setBusy(true);
    const timer = setTimeout(() => { g.timedOut = true; ctrl.abort(); }, CONFIG.ai.timeoutMs);
    const aborted = new Promise((_, rej) => ctrl.signal.addEventListener('abort', () => rej(new Error('aborted'))));
    aborted.catch(() => {});
    let res, err;
    try {
      [res] = await Promise.race([Promise.all([AIProvider.reply(text, state.history, ctrl.signal), wait(rand(CONFIG.ai.typingSpeed))]), aborted]);
    } catch (e) { err = e; }
    clearTimeout(timer);
    stop();
    if (g.stopped || sid !== state.sessionId) { if (gen === g) { gen = null; setBusy(false); } return; }
    if (err) {
      gen = null; setBusy(false);
      renderError(text, g.timedOut ? 'timeout' : navigator.onLine ? 'fail' : 'offline');
      return;
    }
    await botSay(res);
    if (sid !== state.sessionId) return;
    gen = null; setBusy(false);
    if (!res.confident) state.lowConfidence++;

    // Предложение перейти на живую поддержку: после 3–4 вопросов, при двух «непониманиях» подряд или по теме
    const shouldOffer = res.forceHandoff || state.lowConfidence >= 2 || state.userCount >= state.nextOfferAt;
    if (shouldOffer) {
      state.nextOfferAt = Infinity;
      state.lowConfidence = 0;
      await wait(700);
      const t = showTyping(); await wait(900); t();
      renderHandoffOffer(res.confident === false || res.forceHandoff ? 'fail' : 'count');
    }
    save();
  }

  function stopGen() { if (gen) { gen.stopped = true; gen.ctrl.abort(); } }

  function setBusy(b) {
    busy = b;
    el.send.classList.toggle('stop', b);
    el.send.innerHTML = b ? STOP_ICON : SEND_ICON;
    el.send.setAttribute('aria-label', b ? 'Остановить' : 'Отправить');
    el.send.disabled = b ? false : !el.input.value.trim();
    if (state.mode === 'ai') el.hint.textContent = b ? 'ИИ-помощник · печатает…' : 'ИИ-помощник · онлайн';
    refreshRegen();
  }

  /** Ошибка запроса: не теряем вопрос — «Повторить» или «Позвать человека» */
  function renderError(text, kind) {
    const msg = {
      timeout: 'Ответ идёт слишком долго. Попробуйте ещё раз.',
      offline: 'Нет соединения с интернетом. Проверьте сеть и повторите.',
      fail: 'Не удалось получить ответ.'
    }[kind];
    const m = document.createElement('div');
    m.className = 'msg err'; m.dataset.role = 'err'; m.setAttribute('role', 'alert');
    m.innerHTML = `<div class="ava">!</div><div class="bubble">${esc(msg)}
      <div class="err-act"><button type="button" data-a="retry">Повторить</button><button type="button" class="ghost" data-a="human">Позвать человека</button></div></div>`;
    m.querySelector('[data-a="retry"]').onclick = () => { m.remove(); ask(text); };
    m.querySelector('[data-a="human"]').onclick = () => { m.remove(); startHandoff(); };
    el.body.appendChild(m);
    scrollDown();
    emit('error', { kind });
  }

  /** Просим оценку диалога 1–5 выборочно (CONFIG.csatRate), а не после каждого */
  function maybeCsat(done, force) {
    const users = state.history.filter(h => h.role === 'user').length;
    if (!force && (state.csatDone || users < CONFIG.csatMinUserMsgs || Math.random() >= CONFIG.csatRate)) return done();
    state.csatDone = true; save();
    const wrap = document.createElement('div');
    wrap.className = 'csat'; wrap.setAttribute('role', 'dialog'); wrap.setAttribute('aria-label', 'Оценка диалога');
    wrap.innerHTML = `<h4>Как прошёл разговор?</h4><p>Оцените помощь — это поможет нам стать лучше.</p>
      <div class="stars" role="radiogroup" aria-label="Оценка от 1 до 5">${[1, 2, 3, 4, 5].map(n =>
        `<button type="button" role="radio" aria-checked="false" data-n="${n}" aria-label="${n} из 5">★</button>`).join('')}</div>
      <button class="skip" type="button">Пропустить</button>`;
    el.chat.appendChild(wrap);
    requestAnimationFrame(() => wrap.classList.add('show'));
    const stars = [...wrap.querySelectorAll('.stars button')];
    const paint = n => stars.forEach((b, i) => b.classList.toggle('on', i < n));
    const close = () => { wrap.classList.remove('show'); setTimeout(() => { wrap.remove(); done(); }, 350); };
    stars.forEach(b => {
      b.onmouseenter = () => paint(+b.dataset.n);
      b.onmouseleave = () => paint(0);
      b.onclick = () => {
        const score = +b.dataset.n;
        stars.forEach(x => { x.onmouseenter = x.onmouseleave = null; x.setAttribute('aria-checked', String(x === b)); });
        paint(score);
        wrap.querySelector('h4').textContent = 'Спасибо за оценку!';
        if (CONFIG.ai.endpoint) postJSON(CONFIG.ai.csatEndpoint, { session_id: state.sessionId, score }).catch(() => {});
        emit('csat', { score });
        setTimeout(close, 900);
      };
    });
    wrap.querySelector('.skip').onclick = close;
  }

  async function startHandoff() {
    if (state.mode !== 'ai') return;
    setMode('connecting');
    emit('handoff_start');
    renderMessage(push('system', 'Переводим диалог на специалиста'));
    const c = document.createElement('div');
    c.className = 'connecting';
    c.innerHTML = '<div class="spinner"></div><div><b>Ищем свободного специалиста</b><small>Передаём историю переписки — повторять ничего не нужно</small></div>';
    el.body.appendChild(c); scrollDown();

    state.operator = await OperatorProvider.connect(state.history);
    c.remove();
    setMode('operator');
    renderMessage(push('system', `${state.operator.name} подключилась к чату`));
    const t = showTyping(); await wait(1400); t();
    const lastQ = [...state.history].reverse().find(h => h.role === 'user');
    botSay({ text: `Здравствуйте! Меня зовут ${state.operator.name}, я специалист ${CONFIG.brand}. Вижу нашу переписку${lastQ ? ` — вы спрашивали «${lastQ.text.slice(0, 60)}»` : ''}. Сейчас помогу разобраться 🙂` });
    emit('operator_joined', { operator: state.operator });
    save();
  }

  OperatorProvider.onMessage(async msg => {
    const t = showTyping(); await wait(900); t();
    botSay(msg);
  });

  const STARTERS = [
    { ic: '🎨', t: 'Подобрать краскопульт', s: 'Под стены, мебель или фасад', q: 'Подобрать краскопульт' },
    { ic: '🏡', t: 'Покрасить забор', s: 'Что выбрать для улицы', q: 'Хочу покрасить забор' },
    { ic: '🚚', t: 'Доставка и оплата', s: 'Сроки, способы, стоимость', q: 'Как работает доставка?' },
    { ic: '🎁', t: 'Скидка −10%', s: 'Промокод на первый заказ', q: 'Расскажи про промокод HELLO' }
  ];

  function renderHero() {
    const h = document.createElement('section');
    h.className = 'ss-hero'; h.id = 'ssHero';
    h.innerHTML = `
      <div class="ss-orb"><img src="${CONFIG.logo}" alt="${esc(CONFIG.brand)}" width="160" height="124"></div>
      <h1>Чем могу <span>помочь?</span></h1>
      <p>Подберу оборудование под вашу задачу, подскажу по доставке, оплате и гарантии. А если нужно — подключу живого специалиста.</p>
      <div class="ss-starters">${STARTERS.map((x, i) => `
        <button class="starter" type="button" data-i="${i}">
          <span class="ic">${x.ic}</span><span><b>${esc(x.t)}</b><small>${esc(x.s)}</small></span>
        </button>`).join('')}
      </div>`;
    h.querySelectorAll('.starter').forEach(b => b.onclick = () => submit(STARTERS[+b.dataset.i].q));
    el.body.appendChild(h);
  }

  function hideHero() {
    const h = $('ssHero');
    if (!h || h.classList.contains('gone')) return;
    h.classList.add('gone');
    setTimeout(() => h.remove(), 600);
    if (!el.body.querySelector('.ss-day')) {
      const d = document.createElement('div'); d.className = 'ss-day'; d.textContent = 'Сегодня';
      el.body.appendChild(d);
    }
  }

  function restore(saved) {
    Object.assign(state, saved);
    if (state.mode === 'connecting') state.mode = 'ai';
    const day = document.createElement('div'); day.className = 'ss-day'; day.textContent = 'Сегодня';
    el.body.appendChild(day);
    state.history.forEach(h => { renderMessage(h); });
    const last = state.history[state.history.length - 1];
    if (last?.chips) renderChips(last.chips);
    setMode(state.mode);
    scrollDown(true);
  }

  function reset() {
    stopGen(); gen = null; setBusy(false);
    try { localStorage.removeItem(CONFIG.storageKey); } catch (e) {}
    Object.assign(state, { mode: 'ai', userCount: 0, lowConfidence: 0, nextOfferAt: CONFIG.handoffAfter, operator: null, history: [], sessionId: uid(), csatDone: false });
    stick = true;
    el.body.innerHTML = '';
    setMode('ai');
    renderHero();
    el.input.focus();
  }

  /* =====================================================================
   *  СВЯЗЬ С САЙТОМ-РОДИТЕЛЕМ (iframe ⇄ postMessage)
   *  Исходящие: ready, message, user_message, handoff_offer, handoff_start, operator_joined
   *  Входящие:  { source: 'spraystore-host', type: 'send' | 'reset' | 'handoff' | 'focus', text? }
   * ===================================================================== */
  const embedded = window.self !== window.top;
  function emit(type, data) {
    if (!embedded) return;
    try { window.parent.postMessage({ source: 'spraystore-chat', type, ...(data || {}) }, CONFIG.parentOrigin); } catch (e) {}
  }
  window.addEventListener('message', e => {
    if (CONFIG.parentOrigin !== '*' && e.origin !== CONFIG.parentOrigin) return;
    const d = e.data;
    if (!d || d.source !== 'spraystore-host') return;
    if (d.type === 'send' && d.text) submit(String(d.text));
    else if (d.type === 'reset') reset();
    else if (d.type === 'csat') maybeCsat(() => {}, true);
    else if (d.type === 'handoff') startHandoff();
    else if (d.type === 'focus') el.input.focus();
  });

  /* ---------- Events ---------- */
  $('ssReset').onclick = () => maybeCsat(reset);
  el.humanLink.onclick = () => { hideHero(); renderMessage(push('user', 'Позовите специалиста')); startHandoff(); };

  el.input.addEventListener('input', () => {
    el.send.disabled = busy ? false : !el.input.value.trim();
    el.input.style.height = 'auto';
    el.input.style.height = Math.min(el.input.scrollHeight, 120) + 'px';
  });
  el.input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!busy) el.form.requestSubmit(); }
  });
  el.form.addEventListener('submit', e => {
    e.preventDefault();
    if (busy) return stopGen();   // в режиме генерации кнопка работает как «Остановить»
    const v = el.input.value;
    el.input.value = ''; el.input.style.height = 'auto'; el.send.disabled = true;
    submit(v);
  });

  /* ---------- Init ---------- */
  const saved = load();
  if (saved && saved.history.some(h => h.role === 'user')) restore(saved);
  else { if (saved) state.history = []; renderHero(); }

  // ?q=текст — сразу задать вопрос (удобно для кнопок «Спросить про товар» на сайте)
  const q = new URLSearchParams(location.search).get('q');
  if (q) submit(q);

  emit('ready');

  // Публичный API для интеграции с сайтом
  window.SprayChat = { reset, send: submit, handoff: startHandoff, config: CONFIG, state };
})();
</script>
</body>
</html>
